<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Battery Digital Twin — Operator Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk','sans-serif'], mono: ['JetBrains Mono','monospace'] },
                    colors: { primary: '#00f2fe', border: 'rgba(0,242,254,0.12)', card: 'rgba(21,38,52,0.8)' }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 relative overflow-hidden bg-gradient-to-br from-primary/5 to-transparent">
        <div class="text-center mb-6">
            <div class="inline-grid h-12 w-12 place-items-center rounded-xl bg-primary/10 text-primary border border-primary/20 mb-3 animate-pulse">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h3 class="text-xl font-bold text-white leading-tight">EV Battery Digital Twin</h3>
            <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Create Operator Account</p>
        </div>

        <!--FLASH-->

        <form method="POST" action="/register" class="space-y-4" id="register-form" novalidate>
            <div>
                <label for="name" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Full Name *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input id="name" name="name" type="text" required minlength="2" placeholder="John Doe"
                           class="w-full bg-black/40 border border-border rounded pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Operator Email *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input id="email" name="email" type="email" required placeholder="operator@battery.twin"
                           class="w-full bg-black/40 border border-border rounded pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
            </div>

            <div>
                <label for="password-field" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Password * (min 8 chars)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input id="password-field" name="password" type="password" required minlength="8" placeholder="••••••••"
                           class="w-full bg-black/40 border border-border rounded pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
            </div>

            <div>
                <label for="confirm-password-field" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Confirm Password *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fa-solid fa-shield-halved text-xs"></i>
                    </span>
                    <input id="confirm-password-field" name="confirm_password" type="password" required minlength="8" placeholder="••••••••"
                           class="w-full bg-black/40 border border-border rounded pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div id="match-feedback" class="text-[11px] mt-1 font-mono hidden"></div>
            </div>

            <button type="submit" class="w-full py-2.5 rounded bg-primary text-gray-900 font-bold text-xs uppercase tracking-wider hover:opacity-90 transition-all cursor-pointer shadow-md mt-2">
                Create Account
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-white/5 font-mono text-xs">
            <span class="text-gray-400">Already registered?</span>
            <a href="/login" class="text-primary hover:underline font-bold ml-1">Sign In Here</a>
        </div>
    </div>

    <script>
        const pwd = document.getElementById('password-field');
        const confirmPwd = document.getElementById('confirm-password-field');
        const feedback = document.getElementById('match-feedback');
        function checkPasswordsMatch() {
            if (!confirmPwd.value) { feedback.className = 'text-[11px] mt-1 font-mono hidden'; return; }
            if (pwd.value === confirmPwd.value) {
                feedback.innerText = '✓ Passwords match';
                feedback.className = 'text-[11px] mt-1 font-mono text-emerald-400 block';
            } else {
                feedback.innerText = '✗ Passwords do not match';
                feedback.className = 'text-[11px] mt-1 font-mono text-red-400 block';
            }
        }
        if (pwd && confirmPwd) { pwd.addEventListener('input', checkPasswordsMatch); confirmPwd.addEventListener('input', checkPasswordsMatch); }
    </script>
</body>
</html>
